[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dccapacity"
version = "1.0.0"
description = "Capacity planning for a data center: space, power and cooling, forecasts of when each one runs out, and what-if placement, checked against a literal implementation and a synthetic ground truth."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
dccap = "dccapacity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dccapacity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["dccapacity"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
